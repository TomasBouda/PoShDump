trigger:
  branches:
    include:
      - master
  tags:
    include:
      - v*

pr:
  branches:
    include:
      - master

variables:
  buildConfiguration: Release
  moduleName: PoShDump

stages:
  - stage: BuildAndTest
    displayName: Build and test
    jobs:
      - job: Build
        displayName: Build module
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
            clean: true

          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: 8.x

          - task: PowerShell@2
            displayName: Build and smoke test
            inputs:
              pwsh: true
              targetType: filePath
              filePath: ./Test-PoShDump.ps1

          - task: PowerShell@2
            displayName: Validate gallery package
            inputs:
              pwsh: true
              targetType: inline
              script: |
                $manifestPath = "$(Build.SourcesDirectory)\output\$(moduleName)\$(moduleName).psd1"
                $manifest = Test-ModuleManifest $manifestPath

                if (-not $manifest.ExportedCmdlets.ContainsKey('Out-Dump')) {
                  throw "Out-Dump cmdlet is not exported by the module manifest."
                }

                if (-not (Test-Path "$(Build.SourcesDirectory)\output\$(moduleName)\README.md")) {
                  throw "README.md is missing from the gallery package."
                }

          - task: PublishPipelineArtifact@1
            displayName: Publish module artifact
            inputs:
              targetPath: $(Build.SourcesDirectory)\output\$(moduleName)
              artifact: $(moduleName)
              publishLocation: pipeline

  - stage: PublishGallery
    displayName: Publish to PowerShell Gallery
    dependsOn: BuildAndTest
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      - deployment: Publish
        displayName: Publish module
        environment: PowerShellGallery
        pool:
          vmImage: windows-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - task: DownloadPipelineArtifact@2
                  displayName: Download module artifact
                  inputs:
                    artifact: $(moduleName)
                    path: $(Pipeline.Workspace)\$(moduleName)

                - task: PowerShell@2
                  displayName: Publish module to PSGallery
                  inputs:
                    pwsh: true
                    targetType: inline
                    script: |
                      if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY) -or $env:PSGALLERY_API_KEY -like '$(*') {
                        throw "Pipeline secret variable PSGalleryApiKey is not configured."
                      }

                      $modulePath = "$(Pipeline.Workspace)\$(moduleName)"
                      $manifestPath = Join-Path $modulePath "$(moduleName).psd1"

                      Test-ModuleManifest $manifestPath | Out-Null
                      Publish-Module `
                        -Path $modulePath `
                        -Repository PSGallery `
                        -NuGetApiKey $env:PSGALLERY_API_KEY `
                        -Verbose
                  env:
                    PSGALLERY_API_KEY: $(PSGalleryApiKey)
